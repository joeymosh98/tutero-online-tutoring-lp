<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutero — Landing Page Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Login Screen -->
  <div class="cms-login-screen" id="loginScreen">
    <div class="cms-login-card">
      <img src="/shared/images/tutero-logo.svg" alt="Tutero" class="cms-login-logo">
      <h2 class="cms-login-title">Landing Page Dashboard</h2>
      <p class="cms-login-desc">Enter your password to continue.</p>
      <input type="password" id="authPasswordInput" class="cms-input" placeholder="Password">
      <p class="cms-modal-error" id="authError" style="display:none;">Invalid password. Try again.</p>
      <button class="cms-btn cms-btn--primary cms-login-btn" id="authSubmitBtn">Sign In</button>
    </div>
  </div>

  <!-- Dashboard Content (hidden until authenticated) -->
  <div id="dashboardContent" style="display:none;">

  <!-- Header -->
  <header class="dash-header">
    <div class="dash-header-inner">
      <div class="dash-logo">
        <img src="/shared/images/tutero-logo.svg" alt="Tutero" class="dash-logo-img">
        <select class="dash-page-type-select" id="pageTypeSelect">
          <option value="lp">Landing Pages</option>
          <option value="tp">Thank You Pages</option>
          <option value="mp">Digital Marketplace</option>
        </select>
      </div>
      <div class="dash-header-actions">
        <span class="dash-page-count" id="pageCount"></span>
        <button class="dash-lock-btn" id="lockBtn" title="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Division Tabs -->
  <nav class="dash-tabs" id="divisionTabs"></nav>

  <!-- Toolbar -->
  <div class="dash-toolbar">
    <div class="dash-toolbar-inner">
      <div class="dash-search">
        <svg class="dash-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search landing pages..." class="dash-search-input">
      </div>
      <div class="dash-dropdowns">
        <select id="filterStatus" class="dash-select">
          <option value="all">All statuses</option>
          <option value="draft">Draft</option>
          <option value="active">Active</option>
          <option value="paused">Paused</option>
          <option value="archived">Archived</option>
        </select>
        <select id="filterBuiltWith" class="dash-select">
          <option value="all">All platforms</option>
          <option value="custom-html">Custom HTML</option>
          <option value="webflow">Webflow</option>
        </select>
        <select id="filterGrade" class="dash-select">
          <option value="all">All grades</option>
          <option value="green">Green</option>
          <option value="amber">Amber</option>
          <option value="red">Red</option>
          <option value="ungraded">Ungraded</option>
        </select>
        <select id="sortBy" class="dash-select dash-select--sort">
          <option value="name-asc">Name A–Z</option>
          <option value="name-desc">Name Z–A</option>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="grade-desc">Grade high–low</option>
          <option value="grade-asc">Grade low–high</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Card Grid -->
  <main class="dash-main">
    <div class="dash-grid" id="pageGrid"></div>
    <div class="dash-empty" id="emptyState" style="display:none;">
      <p>No pages match your filters.</p>
    </div>
  </main>

  </div><!-- end #dashboardContent -->

  <!-- Edit Page Modal -->
  <div class="cms-modal-overlay" id="editModal" style="display:none;">
    <div class="cms-modal cms-modal--lg">
      <div class="cms-modal-header">
        <h3 class="cms-modal-title" id="editModalTitle">Edit Page</h3>
        <button class="cms-modal-close" id="editCloseBtn">&times;</button>
      </div>
      <div class="cms-modal-body" id="editModalBody">
        <!-- Dynamic form fields injected here -->
      </div>
      <p class="cms-modal-error" id="editError" style="display:none;"></p>
      <p class="cms-modal-success" id="editSuccess" style="display:none;">Saved!</p>
      <div class="cms-modal-actions">
        <button class="cms-btn cms-btn--ghost" id="editCancelBtn">Cancel</button>
        <button class="cms-btn cms-btn--primary" id="editSaveBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
